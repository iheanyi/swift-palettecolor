# swift package plugin --allow-writing-to-package-directory swiftlint
# (the plugin asks for write access up front; it only writes with --fix)

included:
  - Package.swift
  - Sources
  - Tests
excluded:
  - .build

disabled_rules:
  - trailing_comma # House style ends multi-line literals and argument lists with a comma.

identifier_name:
  # Pixel coordinates, color channels, loop indices, and Material's tonal palettes (A1, A2, N1, N2).
  excluded: [x, y, r, g, b, i, j, k, t, v, a1, a2, n1, n2]

large_tuple:
  warning: 3

line_length:
  warning: 120
  ignores_urls: true
